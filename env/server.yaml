# server.yaml
server:
  host   : "0.0.0.0"
  port   : 8000
  reload : false
  workers: 1

ollama:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "qwen3-vl:4b"
  timeout: 20
  streaming: true

http_client:
  max_connections: 100
  max_keepalive_connections: 20
  keepalive_expiry: 30
  timeout:
    connect: 10.0
    read: 120.0
    write: 10.0
    pool: 10.0
  verify: false
  trust_env: false

logging:
  version: 1
  formatters:
    default:
      format   : "[%(asctime)s] [%(levelname)-s] [%(filename)s/%(funcName)s] %(message)s"
  handlers:
    file_logger:
      class       : "src.conf.logging_handler.CustomFileHandler"
      level       : "INFO"
      filename    : "./logs/filename.log"
      encoding    : "utf-8"
      when        : "M"
      interval    : 1
      backupCount : 3
      debug_mode  : True
      formatter   : default
    stream_logger:
      class    : "logging.StreamHandler"
      level    : "DEBUG"
      formatter: default
  root:
    level    : "INFO"
    handlers : ['file_logger', 'stream_logger']

unicorn_logging:
  version: 1
  disable_existing_loggers: False
  formatters:
    default:
      ()         : "uvicorn.logging.DefaultFormatter"
      fmt        : "[%(asctime)s] [%(levelname)-s] [%(filename)s/%(funcName)s] %(message)s"
      use_colors : None
    access:
      () : "uvicorn.logging.AccessFormatter"
      fmt: '%(levelprefix)s %(client_addr)s - "%(request_line)s" %(status_code)s'  # noqa: E501
  handlers:
    default:
      formatter: "default"
      class    : "logging.StreamHandler"
      stream   : "ext://sys.stderr"
    access:
      formatter: "access"
      class    : "logging.StreamHandler"
      stream   : "ext://sys.stdout"
  loggers:
    uvicorn    :
      handlers : ["default"]
      level    : "INFO"
      propagate: False
    uvicorn.error:
      level    : "INFO"
    uvicorn.access:
      handlers : ["access"]
      level    : "INFO"
      propagate: False
