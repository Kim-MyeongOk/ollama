# server.yaml
server:
  host: "0.0.0.0"
  port: 8000
  reload: true

ollama:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "qwen3-vl:4b"
  timeout: 300
  streaming: true

http_client:
  max_connections: 100
  max_keepalive_connections: 20
  keepalive_expiry: 30
  timeout:
    connect: 10.0
    read: 120.0
    write: 10.0
    pool: 10.0
  verify: false
  trust_env: false